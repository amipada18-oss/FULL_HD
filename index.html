<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Page - Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md mx-auto text-center bg-zinc-900 p-6 rounded-2xl shadow-2xl border border-zinc-800">
        
        <div class="relative overflow-hidden rounded-xl mb-6 bg-zinc-800 aspect-video flex items-center justify-center">
            <img id="gif" src="image.gif" alt="Animated GIF" 
                 class="w-full h-full object-cover rounded-xl shadow-lg"
                 onerror="this.onerror=null; this.src='https://placehold.co/600x400/222222/ffffff?text=image.gif+Not+Found';">
        </div>

        <div class="flex flex-col gap-3">
            <a href="https://videohub69.github.io/iconic/" target="_blank" 
               class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl text-lg transition duration-200 shadow-md">
                লিংক ১
            </a>
            <a href="https://drugstoregroan.com/n2i8y1ja?key=177370d793a384e27e328a7ce7fb7877" target="_blank" 
               class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl text-lg transition duration-200 shadow-md">
                লিংক ২
            </a>
        </div>

    </div>

    <script>
        // Check if the user specified 'image.gif' or an array of gifs. 
        // If 'image.gif' is the primary asset, we ensure it loads correctly, or fallback to your folder array if needed.
        window.addEventListener('DOMContentLoaded', () => {
            const gifElement = document.getElementById("gif");
            
            // Optional: If you want to support both image.gif and an array fallback
            const gifs = ["image.gif", "gifs/1.gif", "gifs/2.gif", "gifs/3.gif", "gifs/4.gif"];
            
            // Ensuring image.gif is checked first or randomized safely
            const randomGif = gifs[Math.floor(Math.random() * gifs.length)];
            
            // Set source with error resilience
            gifElement.src = "image.gif"; // Prioritizing image.gif as requested
        });
    </script>

</body>
</html>
